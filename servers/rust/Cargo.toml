[package]
name = "email-api-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-sdk-s3 = "1.159.0"
axum = "0.8.9"
base64 = "0.23.1"
deadpool-postgres = "0.14.2"
futures = "0.3.34"
hex = "0.4.3"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tokio-postgres = "0.7.18"
uuid = { version = "1.29.2", features = ["v4"] }

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
